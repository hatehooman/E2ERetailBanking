# File này chỉnh sửa sau
database:
  postgres:
    dbname: your_db_name
    user: your_db_user
    password: your_db_password
    host: your_db_host
    port: your_db_port
  snowflake:
    user: your_snowflake_user
    password: your_snowflake_password
    account: your_snowflake_account
    warehouse: your_snowflake_warehouse
    database: your_snowflake_database
    schema: your_snowflake_schema

kafka:
  bootstrap_servers: your_kafka_bootstrap_servers
  topic: your_kafka_topic
  group_id: your_kafka_group_id
  auto_offset_reset: your_auto_offset_reset
  enable_auto_commit: your_enable_auto_commit

spark:
  app_name: your_spark_app_name
  master: your_spark_master
  configs:
    spark.some.config.option: some-value
    spark.some.other.config: other-value

logging:
  version: 1
  disable_existing_loggers: False
  formatters:
    simple:
      format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  handlers:
    console:
      class: logging.StreamHandler
      level: DEBUG
      formatter: simple
      stream: ext://sys.stdout
  root:
    level: DEBUG
    handlers: [console]
